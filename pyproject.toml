[project]
name = "sakhi"
version = "0.1.0"
description = "Sakhi – आपकी आवाज़ दीदी: Voice-first accessible civic-tech assistant for PMMVY"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "google-genai==2.26.0",
    "google-cloud-speech==2.40.0",
    "google-cloud-texttospeech==2.38.0",
    "google-cloud-translate==3.23.0",
    "google-cloud-firestore==2.33.0",
    "httpx==0.28.1",
    "slowapi==0.1.10",
    "qrcode[pil]==8.2",
    "python-multipart==0.0.32",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "beautifulsoup4==4.15.0",
    "respx==0.22.0",
    "PyYAML==6.0.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/**/*.json", "static/**/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "google.*",
    "slowapi.*",
    "qrcode.*",
    "respx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
